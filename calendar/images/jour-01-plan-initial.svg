<svg viewBox="0 0 720 245" role="img" aria-labelledby="initial-design-title initial-design-desc" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto">
  <title id="initial-design-title">Le bâtiment et le capteur sont parfaitement confondus</title>
  <desc id="initial-design-desc">Deux associations seulement sont observées : le bâtiment A avec le capteur S1, et le bâtiment B avec le capteur S2. Les associations A-S2 et B-S1 manquent ; il est donc impossible de séparer les effets du bâtiment et du capteur.</desc>
  <rect x="1" y="1" width="718" height="243" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <g font-family="sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#0f172a">
    <text x="180" y="38">Bâtiments</text><text x="540" y="38">Capteurs</text>
  </g>
  <g stroke="#94a3b8" stroke-width="2" fill="#ffffff">
    <rect x="70" y="65" width="220" height="58" rx="9"/><rect x="70" y="151" width="220" height="58" rx="9"/>
    <rect x="430" y="65" width="220" height="58" rx="9"/><rect x="430" y="151" width="220" height="58" rx="9"/>
  </g>
  <g font-family="sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#0f172a">
    <text x="180" y="100">Bâtiment A</text><text x="180" y="186">Bâtiment B</text>
    <text x="540" y="100">Capteur S1</text><text x="540" y="186">Capteur S2</text>
  </g>
  <g stroke="#0f766e" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M290 94 C340 94 380 94 430 94"/><path d="M290 180 C340 180 380 180 430 180"/>
  </g>
  <g font-family="sans-serif" font-size="12" fill="#0f766e" font-weight="700" text-anchor="middle">
    <text x="360" y="81">observé</text><text x="360" y="167">observé</text>
  </g>
  <g stroke="#b45309" stroke-width="2.5" stroke-dasharray="6 5" fill="none">
    <path d="M290 94 C340 120 380 154 430 180"/><path d="M290 180 C340 154 380 120 430 94"/>
  </g>
  <g font-family="sans-serif" font-size="11" fill="#92400e" text-anchor="middle">
    <text x="360" y="225">Comparaisons croisées absentes</text>
  </g>
</svg>