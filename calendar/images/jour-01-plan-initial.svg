<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="initial-title initial-desc">
<title id="initial-title">Plan initial : bâtiment et capteur sont confondus</title>
<desc id="initial-desc">Dans la matrice bâtiment par capteur, seules les cases A-S1 et B-S2 sont observées. Les cases A-S2 et B-S1 sont absentes. Les effets du bâtiment et du capteur ne peuvent pas être séparés.</desc>
<rect width="900" height="360" rx="18" fill="#fbfaf5"/>
<g font-family="Arial,sans-serif">
 <text x="42" y="44" fill="#6c7c70" font-size="14" font-weight="700" letter-spacing="2">PLAN DE MESURE INITIAL</text>
 <text x="42" y="77" fill="#294b3a" font-size="25" font-weight="700">Une seule diagonale est observée</text>
 <text x="42" y="108" fill="#68766d" font-size="15">Chaque bâtiment conserve toujours le même capteur.</text>
 <text x="300" y="151" fill="#6c7c70" font-size="14" font-weight="700" text-anchor="middle">CAPTEUR S1</text>
 <text x="560" y="151" fill="#6c7c70" font-size="14" font-weight="700" text-anchor="middle">CAPTEUR S2</text>
 <text x="68" y="218" fill="#315d49" font-size="16" font-weight="700">BÂTIMENT A</text>
 <text x="68" y="306" fill="#315d49" font-size="16" font-weight="700">BÂTIMENT B</text>
 <rect x="205" y="170" width="190" height="72" rx="10" fill="#e5efe5" stroke="#477b60" stroke-width="2"/>
 <rect x="465" y="170" width="190" height="72" rx="10" fill="#fff4e8" stroke="#d2a071" stroke-width="2" stroke-dasharray="7 5"/>
 <rect x="205" y="258" width="190" height="72" rx="10" fill="#fff4e8" stroke="#d2a071" stroke-width="2" stroke-dasharray="7 5"/>
 <rect x="465" y="258" width="190" height="72" rx="10" fill="#e5efe5" stroke="#477b60" stroke-width="2"/>
 <g fill="#315d49" font-size="22" font-weight="700" text-anchor="middle"><text x="300" y="214">20,0 °C</text><text x="560" y="302">19,5 °C</text></g>
 <g fill="#a36b3d" font-size="28" font-weight="700" text-anchor="middle"><text x="560" y="217">?</text><text x="300" y="305">?</text></g>
 <g fill="#6b7c70" font-size="12" text-anchor="middle"><text x="300" y="232">OBSERVÉ</text><text x="560" y="232">MANQUANT</text><text x="300" y="320">MANQUANT</text><text x="560" y="320">OBSERVÉ</text></g>
 <path d="M690 205 H735 M690 294 H735" stroke="#c28a54" stroke-width="2"/>
 <text x="755" y="202" fill="#8c5d37" font-size="14" font-weight="700">Pas de comparaison</text>
 <text x="755" y="222" fill="#8c5d37" font-size="14">à bâtiment constant</text>
 <text x="755" y="291" fill="#8c5d37" font-size="14" font-weight="700">Pas de comparaison</text>
 <text x="755" y="311" fill="#8c5d37" font-size="14">à capteur constant</text>
</g></svg>