<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="scene-title scene-desc">
<title id="scene-title">Deux bâtiments, deux capteurs, un écart de température à expliquer</title>
<desc id="scene-desc">Deux bâtiments stylisés sont mesurés par deux capteurs différents. Le bâtiment A affiche 20 degrés avec le capteur S1 ; le bâtiment B affiche 19,5 degrés avec le capteur S2. L'illustration souligne que bâtiment et capteur changent simultanément.</desc>
<defs>
  <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbfaf5"/><stop offset="1" stop-color="#edf2e9"/></linearGradient>
  <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#477b60"/><stop offset="1" stop-color="#244637"/></linearGradient>
  <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d6a06a"/><stop offset="1" stop-color="#a35c39"/></linearGradient>
</defs>
<rect x="1" y="1" width="998" height="358" rx="22" fill="url(#paper)" stroke="#d5dfd3" stroke-width="2"/>
<g font-family="Arial,sans-serif">
