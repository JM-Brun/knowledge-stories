    <rect x="224" y="112" width="65" height="55" rx="4" fill="#fcf8f3" stroke="#c7b4a2" stroke-width="2"/>
    <path d="M169 115 V166 M137 140 H202 M256 112 V167 M224 140 H289" stroke="#ddc9b7" stroke-width="2"/>
