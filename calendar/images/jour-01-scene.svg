    <path d="M169 115 V166 M137 140 H202 M256 112 V167 M224 140 H289" stroke="#c0d0c1" stroke-width="2"/>
    <circle cx="274" cy="194" r="7" fill="#477b60"/>
    <rect x="236" y="185" width="25" height="42" rx="12" fill="#477b60"/>
    <path d="M248 185 V169" stroke="#477b60" stroke-width="4" stroke-linecap="round"/>
