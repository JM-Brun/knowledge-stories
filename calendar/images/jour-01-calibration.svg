<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="calibration-title calibration-desc">
<title id="calibration-title">Les trois indications de chaque capteur sont regroupées, mais décalées d'un degré</title>
<desc id="calibration-desc">Sur un même axe de température, les trois indications du capteur S1 sont 19,9, 20,0 et 20,1 degrés, autour de la référence 20,00. Celles de S2 sont 18,9, 19,0 et 19,1 degrés. Les deux séries ont la même étendue observée de 0,2 degré, mais leurs centres sont séparés d'un degré.</desc>
<rect width="900" height="330" rx="16" fill="#fbfaf5"/>
<g font-family="Arial,sans-serif">
 <text x="38" y="40" fill="#6c7c70" font-size="13" font-weight="700" letter-spacing="2">COMPARAISON À LA RÉFÉRENCE</text>
 <text x="38" y="72" fill="#294b3a" font-size="23" font-weight="700">Même étendue observée, centres décalés</text>
 <text x="38" y="100" fill="#718076" font-size="14">Trois indications par capteur · axe commun en degrés Celsius</text>
 <line x1="160" y1="143" x2="800" y2="143" stroke="#d7dfd5" stroke-width="2"/>
 <line x1="160" y1="223" x2="800" y2="223" stroke="#d7dfd5" stroke-width="2"/>
 <line x1="708.6" y1="125" x2="708.6" y2="254" stroke="#b68b4f" stroke-width="3" stroke-dasharray="6 5"/>
 <rect x="646" y="111" width="125" height="25" rx="5" fill="#f4ead8"/>
 <text x="708.5" y="128" fill="#8b6535" font-size="12" font-weight="700" text-anchor="middle">RÉF. 20,00 °C</text>
 <text x="38" y="168" fill="#315d49" font-size="17" font-weight="700">S1</text>
 <text x="38" y="188" fill="#718076" font-size="12">moyenne 20,0</text>
 <text x="38" y="248" fill="#a35c39" font-size="17" font-weight="700">S2</text>
 <text x="38" y="268" fill="#718076" font-size="12">moyenne 19,0</text>
 <g fill="#477b60" stroke="#fffefa" stroke-width="3">
  <circle cx="663" cy="143" r="10"/><circle cx="708.6" cy="143" r="10"/><circle cx="754.3" cy="143" r="10"/>
 </g>
 <g fill="#b8754a" stroke="#fffefa" stroke-width="3">
  <circle cx="205.7" cy="223" r="10"/><circle cx="251.4" cy="223" r="10"/><circle cx="297.1" cy="223" r="10"/>
 </g>
 <g fill="#53665b" font-size="12" text-anchor="middle">
  <text x="663" y="123">19,9</text><text x="708.6" y="123">20,0</text><text x="754.3" y="123">20,1</text>
  <text x="205.7" y="203">18,9</text><text x="251.4" y="203">19,0</text><text x="297.1" y="203">19,1</text>
 </g>
 <line x1="160" y1="282" x2="800" y2="282" stroke="#9aaa9c" stroke-width="1.5"/>
 <g stroke="#9aaa9c" stroke-width="1.5">
  <path d="M160 277 V288 M342.9 277 V288 M525.7 277 V288 M708.6 277 V288 M800 277 V288"/>
 </g>
 <g fill="#718076" font-size="12" text-anchor="middle">
  <text x="160" y="307">18,8</text><text x="342.9" y="307">19,2</text><text x="525.7" y="307">19,6</text><text x="708.6" y="307">20,0</text><text x="800" y="307">20,2 °C</text>
 </g>
</g></svg>