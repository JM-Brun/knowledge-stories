<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="cross-title cross-desc">
<title id="cross-title">Plan croisé : les quatre combinaisons sont observées</title>
<desc id="cross-desc">Les deux capteurs sont utilisés dans les deux bâtiments. Chaque ligne permet de comparer les capteurs à bâtiment constant et chaque colonne de comparer les bâtiments à capteur constant.</desc>
<rect width="900" height="360" rx="18" fill="#fbfaf5"/>
<g font-family="Arial,sans-serif">
 <text x="42" y="44" fill="#596b5e" font-size="14" font-weight="700" letter-spacing="2">PLAN CROISÉ</text>
 <text x="42" y="77" fill="#294b3a" font-size="25" font-weight="700">Les quatre comparaisons existent</text>
 <text x="42" y="108" fill="#526359" font-size="15">On change un facteur à la fois pour construire les contrastes.</text>
 <text x="330" y="151" fill="#596b5e" font-size="14" font-weight="700" text-anchor="middle">CAPTEUR S1</text>
 <text x="590" y="151" fill="#596b5e" font-size="14" font-weight="700" text-anchor="middle">CAPTEUR S2</text>
 <text x="68" y="218" fill="#315d49" font-size="16" font-weight="700">BÂTIMENT A</text>
 <text x="68" y="306" fill="#315d49" font-size="16" font-weight="700">BÂTIMENT B</text>
 <rect x="235" y="170" width="190" height="72" rx="10" fill="#e5efe5" stroke="#477b60" stroke-width="2"/>
 <rect x="495" y="170" width="190" height="72" rx="10" fill="#f0eafa" stroke="#9272b2" stroke-width="2"/>
 <rect x="235" y="258" width="190" height="72" rx="10" fill="#e5efe5" stroke="#477b60" stroke-width="2"/>
 <rect x="495" y="258" width="190" height="72" rx="10" fill="#f0eafa" stroke="#9272b2" stroke-width="2"/>
 <g font-size="22" font-weight="700" text-anchor="middle"><text x="330" y="214" fill="#315d49">20,0 °C</text><text x="590" y="214" fill="#76549a">19,0 °C</text><text x="330" y="302" fill="#315d49">20,5 °C</text><text x="590" y="302" fill="#76549a">19,5 °C</text></g>
 <g fill="#596b5e" font-size="12" text-anchor="middle"><text x="330" y="232">OBSERVÉ</text><text x="590" y="232">OBSERVÉ</text><text x="330" y="320">OBSERVÉ</text><text x="590" y="320">OBSERVÉ</text></g>
 <path d="M710 205 H748 M710 294 H748" stroke="#477b60" stroke-width="2"/>
 <text x="765" y="202" fill="#315d49" font-size="14" font-weight="700">−1,0 °C</text>
 <text x="765" y="222" fill="#526359" font-size="12">contraste capteur</text>
 <text x="765" y="291" fill="#315d49" font-size="14" font-weight="700">+0,5 °C</text>
 <text x="765" y="311" fill="#526359" font-size="12">contraste bâtiment</text>
</g></svg>