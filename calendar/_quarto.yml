project:
  type: website
  output-dir: ../dist/calendar
  render:
    - index.qmd
    - en/index.qmd
    - days/*.qmd
    - exercices/*.qmd

website:
  title: "Calendrier Data Science & ML 2026"
  site-url: "https://jm-brun.github.io/knowledge-stories/calendar/"
  description: "24 idées pour comprendre les données, apprendre à partir d'exemples et évaluer les modèles."
  navbar:
    left:
      - href: index.qmd
        text: Le calendrier
    right:
      - text: Knowledge Stories
        href: /knowledge-stories/
  page-footer:
    left: "Knowledge Stories · Édition 2026"
    right: "Contenus pédagogiques indépendants"

format:
  html:
    theme: cosmo
    # Let article pages use the available viewport; text measures remain constrained in CSS.
    page-layout: full
    html-math-method:
      method: mathjax
      url: "https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml-full.js"
    css: styles.css
    toc: true
    toc-depth: 2
    number-sections: false
    code-copy: true
    lang: fr

execute:
  freeze: auto
