name: Publish Knowledge Stories and Quarto calendar

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: knowledge-stories-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check Astro
        run: npm run check
      - name: Build Knowledge Stories
        run: npm run build
      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.11.9"
      - name: Render the 2026 calendar
        run: |
          timing="$RUNNER_TEMP/quarto-render-time.txt"
          /usr/bin/time -f 'Quarto render: %e s elapsed, %M KiB peak RSS' \
            -o "$timing" quarto render calendar
          tee -a "$GITHUB_STEP_SUMMARY" < "$timing"
      - name: Verify combined publication
        run: |
          test -f dist/index.html
          test -f dist/calendar/index.html
          test -f dist/calendar/en/index.html
          test -f dist/calendar/days/jour-01.html
          test -f dist/calendar/days/jour-05.html
          test -f dist/atelier/index.html
          test -f dist/atelier/karatsuba-multiplication/index.html
          test -f dist/atelier/paradoxe-des-jumeaux/index.html
          grep -q "atelier/karatsuba-multiplication/" dist/atelier/index.html
          grep -q "atelier/paradoxe-des-jumeaux/" dist/atelier/index.html
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy site and calendar
        id: deployment
        uses: actions/deploy-pages@v4
